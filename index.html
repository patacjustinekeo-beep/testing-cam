<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Fast Green Aura Tracker</title>
  <!-- Preload pinned MediaPipe files so Chrome downloads them immediately -->
  <link rel="preload" href="https://jsdelivr.net" as="script" crossorigin="anonymous" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050a07;
      color: #e0ffe8;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #status {
      position: absolute;
      top: 16px;
      z-index: 10;
      background: rgba(0, 20, 10, 0.85);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid rgba(0, 255, 128, 0.4);
      pointer-events: none;
      text-align: center;
      max-width: 90vw;
    }
    #viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mirrored { transform: scaleX(-1); }
    #controls {
      position: absolute;
      bottom: 24px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 14px 26px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }
    button:active { transform: scale(0.95); }
    #startBtn {
      background: #00ff80;
      color: #002211;
    }
    #switchBtn {
      background: rgba(10, 30, 20, 0.85);
      color: #00ff80;
      border: 1px solid #00ff80;
      display: none;
    }
  </style>
</head>
<body>

  <div id="status">Tap Start Camera</div>

  <div id="viewer">
    <video id="webcam" autoplay playsinline muted class="mirrored"></video>
    <canvas id="auraCanvas" class="mirrored"></canvas>
  </div>

  <div id="controls">
    <button id="startBtn" type="button">Start Camera</button>
    <button id="switchBtn" type="button">Switch Camera</button>
  </div>

  <!-- 1. Standalone Camera Script (Runs immediately, never blocked by AI download) -->
  <script>
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("auraCanvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const switchBtn = document.getElementById("switchBtn");
    const statusText = document.getElementById("status");

    let currentStream = null;
    let facingMode = "user";
    let cameraActive = false;

    async function openCamera() {
      statusText.innerText = "Starting camera...";
      if (currentStream) {
        currentStream.getTracks().forEach(function (track) { track.stop(); });
      }

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: facingMode,
            width: { ideal: 320 },
            height: { ideal: 240 }
          },
          audio: false
        });

        video.srcObject = currentStream;
        video.classList.toggle("mirrored", facingMode === "user");
        canvas.classList.toggle("mirrored", facingMode === "user");

        await video.play();
        canvas.width = video.videoWidth || 320;
        canvas.height = video.videoHeight || 240;

        startBtn.style.display = "none";
        switchBtn.style.display = "inline-block";
        cameraActive = true;
        statusText.innerText = window.aiLoaded
          ? "Open your hand for green aura!"
          : "Camera on! Loading hand AI...";
      } catch (err) {
        statusText.innerText = "Camera error: " + err.message;
      }
    }

    startBtn.addEventListener("click", openCamera);
    switchBtn.addEventListener("click", function () {
      facingMode = facingMode === "user" ? "environment" : "user";
      openCamera();
    });
  </script>

  <!-- 2. Load Pinned MediaPipe Hands Separately -->
  <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

  <!-- 3. Hand Tracking & Green Aura Script -->
  <script>
    window.aiLoaded = false;
    let latestLandmarks = null;
    let auraIntensity = 0;
    let pulseAngle = 0;
    let isSending = false;

    const TIPS = "8,12,16,20".split(",").map(Number);
    const PIPS = "6,10,14,18".split(",").map(Number);
    const BONES = "0-1,1-2,2-3,3-4,0-5,5-6,6-7,7-8,5-9,9-10,10-11,11-12,9-13,13-14,14-15,15-16,13-17,0-17,17-18,18-19,19-20".split(",");

    function isHandOpen(lm) {
      const wrist = lm.at(0);
      let openFingers = 0;
      for (let i = 0; i < 4; i++) {
        const tip = lm.at(TIPS.at(i));
        const pip = lm.at(PIPS.at(i));
        const dTip = Math.pow(tip.x - wrist.x, 2) + Math.pow(tip.y - wrist.y, 2);
        const dPip = Math.pow(pip.x - wrist.x, 2) + Math.pow(pip.y - wrist.y, 2);
        if (dTip > dPip * 1.2) openFingers++;
      }
      return openFingers >= 3;
    }

    function drawGreenAura(lm, intensity) {
      const w = canvas.width;
      const h = canvas.height;
      const palm = lm.at(9);
      const px = palm.x * w;
      const py = palm.y * h;

      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      // Soft radial aura glow
      const radius = Math.min(w, h) * 0.4 * intensity;
      const grad = ctx.createRadialGradient(px, py, 4, px, py, radius);
      grad.addColorStop(0, "rgba(150, 255, 190, " + (0.7 * intensity) + ")");
      grad.addColorStop(0.5, "rgba(0, 230, 118, " + (0.35 * intensity) + ")");
      grad.addColorStop(1, "rgba(0, 255, 100, 0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fill();

      // Wrapping neon energy lines along fingers
      ctx.lineCap = "round";
      ctx.beginPath();
      for (let i = 0; i < BONES.length; i++) {
        const parts = BONES.at(i).split("-");
        const a = lm.at(Number(parts.at(0)));
        const b = lm.at(Number(parts.at(1)));
        ctx.moveTo(a.x * w, a.y * h);
        ctx.lineTo(b.x * w, b.y * h);
      }

      ctx.strokeStyle = "rgba(0, 255, 128, " + (0.4 * intensity) + ")";
      ctx.lineWidth = 8 + Math.sin(pulseAngle * 2) * 2;
      ctx.stroke();

      ctx.strokeStyle = "rgba(210, 255, 225, " + (0.95 * intensity) + ")";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Orbiting energy ring wrapping around open hand
      const ringR = 35 + Math.sin(pulseAngle) * 6;
      ctx.strokeStyle = "rgba(100, 255, 160, " + (0.85 * intensity) + ")";
      ctx.lineWidth = 2;
      ctx.setLineDash("12,6".split(",").map(Number));
      ctx.lineDashOffset = -pulseAngle * 18;

      ctx.beginPath();
      ctx.ellipse(px, py, ringR * 1.25, ringR * 0.85, pulseAngle * 0.5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    // Safely initialize MediaPipe only after script loads
    if (window.Hands) {
      const hands = new window.Hands({
        locateFile: function (file) {
          return "https://jsdelivr.net" + file;
        }
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.45,
        minTrackingConfidence: 0.45
      });

      hands.onResults(function (results) {
        if (!window.aiLoaded) {
          window.aiLoaded = true;
          if (cameraActive) {
            statusText.innerText = "Open your hand for green aura!";
          }
        }
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          latestLandmarks = results.multiHandLandmarks.at(0);
        } else {
          latestLandmarks = null;
        }
      });

      async function loop() {
        if (cameraActive && video.readyState >= 2) {
          if (!isSending) {
            isSending = true;
            try {
              await hands.send({ image: video });
            } catch (e) {}
            isSending = false;
          }

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pulseAngle += 0.12;

          if (latestLandmarks && isHandOpen(latestLandmarks)) {
            auraIntensity = Math.min(1, auraIntensity + 0.18);
          } else {
            auraIntensity = Math.max(0, auraIntensity - 0.12);
          }

          if (latestLandmarks && auraIntensity > 0.02) {
            drawGreenAura(latestLandmarks, auraIntensity);
          }
        }
        requestAnimationFrame(loop);
      }
      loop();
    } else {
      statusText.innerText = "AI script blocked by network. Camera still works!";
    }
  </script>
</body>
</html>
