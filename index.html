<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Green Aura v6</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050a07;
      color: #e0ffe8;
      font-family: system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0, 20, 10, 0.9);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      border: 1px solid #00ff80;
      text-align: center;
      width: max-content;
      max-width: 92vw;
    }
    video, canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }
    .mirrored { transform: scaleX(-1); }
    #controls {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }
    #startBtn { background: #00ff80; color: #002211; }
    #switchBtn { background: #0d261a; color: #00ff80; border: 2px solid #00ff80; display: none; }
  </style>
</head>
<body>

  <div id="status">Tap Start Camera (v6)</div>
  <video id="webcam" autoplay playsinline muted class="mirrored"></video>
  <canvas id="auraCanvas" class="mirrored"></canvas>

  <div id="controls">
    <button id="startBtn" type="button">Start Camera</button>
    <button id="switchBtn" type="button">Switch Camera</button>
  </div>

  <!-- Load TensorFlow.js + Hand Pose Detection (Pure JS/WebGL, no stuck WASM) -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>

  <script>
    var video = document.getElementById("webcam");
    var canvas = document.getElementById("auraCanvas");
    var ctx = canvas.getContext("2d");
    var startBtn = document.getElementById("startBtn");
    var switchBtn = document.getElementById("switchBtn");
    var statusText = document.getElementById("status");

    var currentStream = null;
    var facingMode = "user";
    var cameraActive = false;
    var detector = null;
    var auraLevel = 0;
    var angle = 0;

    var TIPS = "8,12,16,20".split(",").map(Number);
    var PIPS = "6,10,14,18".split(",").map(Number);
    var BONES = "0-1,1-2,2-3,3-4,0-5,5-6,6-7,7-8,5-9,9-10,10-11,11-12,9-13,13-14,14-15,15-16,13-17,0-17,17-18,18-19,19-20".split(",");

    // 1. Start Camera Immediately
    function startCameraNow() {
      statusText.innerText = "Opening camera...";
      if (currentStream) {
        currentStream.getTracks().forEach(function(t) { t.stop(); });
      }
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: facingMode, width: { ideal: 320 }, height: { ideal: 240 } },
        audio: false
      }).then(function(stream) {
        currentStream = stream;
        video.srcObject = stream;
        video.className = facingMode === "user" ? "mirrored" : "";
        canvas.className = facingMode === "user" ? "mirrored" : "";
        video.play();
        canvas.width = 320;
        canvas.height = 240;
        startBtn.style.display = "none";
        switchBtn.style.display = "inline-block";
        cameraActive = true;
        statusText.innerText = detector ? "Open your hand for green aura!" : "Camera ON! Initializing AI...";
      }).catch(function(err) {
        statusText.innerText = "Camera error: " + err.message;
      });
    }

    startBtn.onclick = startCameraNow;
    switchBtn.onclick = function() {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCameraNow();
    };

    // 2. Load Hand Detector with Clear Error Feedback
    async function setupDetector() {
      try {
        if (!window.handPoseDetection) {
          statusText.innerText = "Script blocked by network. Refresh page.";
          return;
        }
        var model = window.handPoseDetection.SupportedModels.MediaPipeHands;
        detector = await window.handPoseDetection.createDetector(model, {
          runtime: "tfjs",
          modelType: "lite",
          maxHands: 1
        });
        statusText.innerText = cameraActive ? "Open your hand for green aura!" : "AI Ready! Tap Start Camera (v6)";
      } catch (err) {
        statusText.innerText = "AI Setup Error: " + err.message;
      }
    }

    setupDetector();

    // 3. Check Open Hand (Using keypoints x, y in pixels)
    function checkOpen(kp) {
      var w = kp.at(0);
      var count = 0;
      for (var i = 0; i < 4; i++) {
        var t = kp.at(TIPS.at(i));
        var p = kp.at(PIPS.at(i));
        var dt = Math.pow(t.x - w.x, 2) + Math.pow(t.y - w.y, 2);
        var dp = Math.pow(p.x - w.x, 2) + Math.pow(p.y - w.y, 2);
        if (dt > dp * 1.2) count++;
      }
      return count >= 3;
    }

    // 4. Draw Green Aura & Wrapping Energy
    function drawAura(kp, power) {
      var w = canvas.width;
      var h = canvas.height;
      var palm = kp.at(9);
      var px = palm.x;
      var py = palm.y;

      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      var r = Math.min(w, h) * 0.42 * power;
      var g = ctx.createRadialGradient(px, py, 4, px, py, r);
      g.addColorStop(0, "rgba(150,255,190," + (0.75 * power) + ")");
      g.addColorStop(0.5, "rgba(0,230,118," + (0.35 * power) + ")");
      g.addColorStop(1, "rgba(0,255,100,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineCap = "round";
      ctx.beginPath();
      for (var i = 0; i < BONES.length; i++) {
        var pair = BONES.at(i).split("-");
        var a = kp.at(Number(pair.at(0)));
        var b = kp.at(Number(pair.at(1)));
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
      }
      ctx.strokeStyle = "rgba(0,255,128," + (0.45 * power) + ")";
      ctx.lineWidth = 8;
      ctx.stroke();
      ctx.strokeStyle = "rgba(220,255,230," + (0.95 * power) + ")";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      var ring = 35 + Math.sin(angle) * 6;
      ctx.strokeStyle = "rgba(100,255,160," + (0.85 * power) + ")";
      ctx.lineWidth = 2;
      ctx.setLineDash("12,6".split(",").map(Number));
      ctx.lineDashOffset = -angle * 18;
      ctx.beginPath();
      ctx.ellipse(px, py, ring * 1.25, ring * 0.85, angle * 0.5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    // 5. Render Loop
    async function loop() {
      if (cameraActive && video.readyState >= 2) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        angle += 0.12;

        var kp = null;
        if (detector) {
          try {
            var handsFound = await detector.estimateHands(video, { flipHorizontal: false });
            if (handsFound && handsFound.length > 0) {
              kp = handsFound.at(0).keypoints;
            }
          } catch (e) {}
        }

        if (kp && checkOpen(kp)) {
          auraLevel = Math.min(1, auraLevel + 0.18);
        } else {
          auraLevel = Math.max(0, auraLevel - 0.12);
        }

        if (kp && auraLevel > 0.02) {
          drawAura(kp, auraLevel);
        }
      }
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
