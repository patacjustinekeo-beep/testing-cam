<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Jumper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(to bottom, #1e3c72, #2a5298, #87ceeb);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 36px; margin-bottom: 10px; }
    p { font-size: 16px; margin-bottom: 20px; opacity: 0.9; }
    button {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #1e3c72;
      background: #fff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <div id="ui">
    <span id="score">Score: 0</span>
    <span id="high-score">Best: 0</span>
  </div>
  <div id="overlay">
    <h1 id="title">☁️ Cloud Jumper</h1>
    <p id="subtitle">Use <b>Left / Right Arrows</b> or <b>A / D</b> to move.<br>Bounce on white clouds and avoid dark storm clouds!</p>
    <button id="start-btn">Play Game</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('high-score');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');
  const startBtn = document.getElementById('start-btn');

  let animationId;
  let score = 0;
  let highScore = localStorage.getItem('cloudJumperBest') || 0;
  highScoreEl.textContent = `Best: ${highScore}`;

  const keys = { left: false, right: false };

  const player = {
    x: 185,
    y: 450,
    width: 30,
    height: 30,
    vx: 0,
    vy: 0,
    speed: 5.5,
    gravity: 0.35,
    jumpPower: -10.5
  };

  let clouds = [];
  const cloudCount = 7;

  function createCloud(y, forceSafe = false) {
    const isStorm = !forceSafe && Math.random() < 0.2 && score > 100;
    const isMoving = !isStorm && Math.random() < 0.25 && score > 50;
    return {
      x: Math.random() * (canvas.width - 80),
      y: y,
      width: 80,
      height: 22,
      type: isStorm ? 'storm' : (isMoving ? 'moving' : 'normal'),
      vx: isMoving ? (Math.random() < 0.5 ? 2 : -2) : 0
    };
  }

  function initGame() {
    score = 0;
    scoreEl.textContent = `Score: 0`;
    player.x = canvas.width / 2 - player.width / 2;
    player.y = 450;
    player.vx = 0;
    player.vy = player.jumpPower;

    clouds = [];
    // Starting base cloud
    clouds.push({ x: canvas.width / 2 - 40, y: 520, width: 80, height: 22, type: 'normal', vx: 0 });
    for (let i = 1; i < cloudCount; i++) {
      clouds.push(createCloud(520 - i * 85, true));
    }
  }

  function drawCloud(c) {
    ctx.fillStyle = c.type === 'storm' ? '#4a5568' : '#ffffff';
    ctx.beginPath();
    ctx.roundRect(c.x, c.y, c.width, c.height, 11);
    ctx.fill();

    // Fluffy bumps
    ctx.beginPath();
    ctx.arc(c.x + 22, c.y, 14, 0, Math.PI * 2);
    ctx.arc(c.x + 45, c.y - 4, 17, 0, Math.PI * 2);
    ctx.arc(c.x + 64, c.y + 2, 12, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    // Character body
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.roundRect(player.x, player.y, player.width, player.height, 8);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + 6, player.y + 8, 6, 6);
    ctx.fillRect(player.x + 18, player.y + 8, 6, 6);
    ctx.fillStyle = '#000';
    ctx.fillRect(player.x + 8, player.y + 10, 3, 3);
    ctx.fillRect(player.x + 20, player.y + 10, 3, 3);
  }

  function update() {
    // Horizontal movement
    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx *= 0.85;

    player.x += player.vx;

    // Screen wrap-around
    if (player.x + player.width < 0) player.x = canvas.width;
    if (player.x > canvas.width) player.x = -player.width;

    // Vertical physics
    player.vy += player.gravity;
    player.y += player.vy;

    // Camera scroll upward when player goes above middle
    if (player.y < canvas.height / 2 && player.vy < 0) {
      const diff = (canvas.height / 2) - player.y;
      player.y = canvas.height / 2;
      score += Math.floor(diff * 0.1);
      scoreEl.textContent = `Score: ${score}`;

      clouds.forEach(c => {
        c.y += diff;
      });
    }

    // Update clouds & check landing
    clouds.forEach((c, index) => {
      if (c.type === 'moving') {
        c.x += c.vx;
        if (c.x <= 0 || c.x + c.width >= canvas.width) c.vx *= -1;
      }

      // Bounce check when falling
      if (
        player.vy > 0 &&
        player.x + player.width > c.x + 5 &&
        player.x < c.x + c.width - 5 &&
        player.y + player.height >= c.y &&
        player.y + player.height <= c.y + c.height + player.vy
      ) {
        if (c.type === 'storm') {
          gameOver();
        } else {
          player.vy = player.jumpPower;
        }
      }

      // Recycle off-screen clouds
      if (c.y > canvas.height) {
        clouds[index] = createCloud(-20);
      }
    });

    // Fall off bottom
    if (player.y > canvas.height) {
      gameOver();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    clouds.forEach(drawCloud);
    drawPlayer();
  }

  function loop() {
    update();
    draw();
    animationId = requestAnimationFrame(loop);
  }

  function gameOver() {
    cancelAnimationFrame(animationId);
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('cloudJumperBest', highScore);
      highScoreEl.textContent = `Best: ${highScore}`;
    }
    titleEl.textContent = 'Game Over!';
    subtitleEl.innerHTML = `Final Score: <b>${score}</b>`;
    startBtn.textContent = 'Play Again';
    overlay.style.display = 'flex';
  }

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  });

  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  startBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
    initGame();
    loop();
  });
</script>
</body>
</html>
