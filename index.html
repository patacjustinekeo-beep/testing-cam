<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Fast Green Aura Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050a07;
      color: #e0ffe8;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #status {
      position: absolute;
      top: 16px;
      z-index: 10;
      background: rgba(0, 20, 10, 0.85);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid rgba(0, 255, 128, 0.4);
      pointer-events: none;
      text-align: center;
    }
    #viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mirrored { transform: scaleX(-1); }
    #controls {
      position: absolute;
      bottom: 24px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }
    button:active { transform: scale(0.95); }
    #startBtn {
      background: #00ff80;
      color: #002211;
    }
    #switchBtn {
      background: rgba(10, 30, 20, 0.85);
      color: #00ff80;
      border: 1px solid #00ff80;
      display: none;
    }
  </style>
</head>
<body>

  <div id="status">Tap Start Camera to begin</div>

  <div id="viewer">
    <video id="webcam" autoplay playsinline muted class="mirrored"></video>
    <canvas id="auraCanvas" class="mirrored"></canvas>
  </div>

  <div id="controls">
    <button id="startBtn" type="button" onclick="window.startCam()">Start Camera</button>
    <button id="switchBtn" type="button" onclick="window.switchCam()">Switch Camera</button>
  </div>

  <script>
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("auraCanvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const switchBtn = document.getElementById("switchBtn");
    const statusText = document.getElementById("status");

    let handLandmarker = null;
    let currentStream = null;
    let facingMode = "user";
    let isRunning = false;
    let auraIntensity = 0;
    let pulseAngle = 0;

    // 1. Instant Camera Handler (Works even before AI finishes loading)
    window.startCam = async function () {
      if (currentStream) {
        currentStream.getTracks().forEach(function (t) { t.stop(); });
      }
      statusText.innerText = "Requesting camera permission...";

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: facingMode,
            width: { ideal: 480 },
            height: { ideal: 360 }
          },
          audio: false
        });

        video.srcObject = currentStream;
        video.classList.toggle("mirrored", facingMode === "user");
        canvas.classList.toggle("mirrored", facingMode === "user");

        video.onloadedmetadata = function () {
          video.play();
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          startBtn.style.display = "none";
          switchBtn.style.display = "inline-block";
          statusText.innerText = handLandmarker
            ? "Open your hand for green aura!"
            : "Camera active! Loading hand AI...";

          if (!isRunning) {
            isRunning = true;
            requestAnimationFrame(renderLoop);
          }
        };
      } catch (err) {
        statusText.innerText = "Camera blocked: " + err.message;
      }
    };

    window.switchCam = function () {
      facingMode = facingMode === "user" ? "environment" : "user";
      window.startCam();
    };

    // 2. Bracket-safe landmark index lists using .split()
    const TIPS = "8,12,16,20".split(",").map(Number);
    const PIPS = "6,10,14,18".split(",").map(Number);
    const BONES = "0-1,1-2,2-3,3-4,0-5,5-6,6-7,7-8,5-9,9-10,10-11,11-12,9-13,13-14,14-15,15-16,13-17,0-17,17-18,18-19,19-20".split(",");

    function isHandOpen(lm) {
      const wrist = lm.at(0);
      let openFingers = 0;
      for (let i = 0; i < 4; i++) {
        const tip = lm.at(TIPS.at(i));
        const pip = lm.at(PIPS.at(i));
        const dTip = Math.pow(tip.x - wrist.x, 2) + Math.pow(tip.y - wrist.y, 2);
        const dPip = Math.pow(pip.x - wrist.x, 2) + Math.pow(pip.y - wrist.y, 2);
        if (dTip > dPip * 1.25) openFingers++;
      }
      return openFingers >= 3;
    }

    function drawFastAura(lm, intensity) {
      const w = canvas.width;
      const h = canvas.height;
      const palm = lm.at(9);
      const px = palm.x * w;
      const py = palm.y * h;

      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      // Soft radial aura glow
      const radius = Math.min(w, h) * 0.36 * intensity;
      const grad = ctx.createRadialGradient(px, py, 5, px, py, radius);
      grad.addColorStop(0, "rgba(140, 255, 180, " + (0.65 * intensity) + ")");
      grad.addColorStop(0.45, "rgba(0, 230, 118, " + (0.3 * intensity) + ")");
      grad.addColorStop(1, "rgba(0, 255, 100, 0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fill();

      // Wrapping neon hand skeleton
      ctx.lineCap = "round";
      ctx.beginPath();
      for (let i = 0; i < BONES.length; i++) {
        const parts = BONES.at(i).split("-");
        const a = lm.at(Number(parts.at(0)));
        const b = lm.at(Number(parts.at(1)));
        ctx.moveTo(a.x * w, a.y * h);
        ctx.lineTo(b.x * w, b.y * h);
      }

      ctx.strokeStyle = "rgba(0, 255, 128, " + (0.35 * intensity) + ")";
      ctx.lineWidth = 10 + Math.sin(pulseAngle * 2) * 3;
      ctx.stroke();

      ctx.strokeStyle = "rgba(200, 255, 220, " + (0.9 * intensity) + ")";
      ctx.lineWidth = 3;
      ctx.stroke();

      // Rotating energy ring wrapping the open hand
      const ringR = 45 + Math.sin(pulseAngle) * 8;
      ctx.strokeStyle = "rgba(100, 255, 160, " + (0.8 * intensity) + ")";
      ctx.lineWidth = 2.5;
      ctx.setLineDash("14,8".split(",").map(Number));
      ctx.lineDashOffset = -pulseAngle * 20;

      ctx.beginPath();
      ctx.ellipse(px, py, ringR * 1.25, ringR * 0.85, pulseAngle * 0.5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    let lastVideoTime = -1;
    function renderLoop() {
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pulseAngle += 0.1;

        if (handLandmarker) {
          const results = handLandmarker.detectForVideo(video, performance.now());
          const lm = results.landmarks && results.landmarks.at(0);

          if (lm && isHandOpen(lm)) {
            auraIntensity = Math.min(1, auraIntensity + 0.15);
          } else {
            auraIntensity = Math.max(0, auraIntensity - 0.1);
          }

          if (lm && auraIntensity > 0.02) {
            drawFastAura(lm, auraIntensity);
          }
        }
      }
      requestAnimationFrame(renderLoop);
    }

    // 3. Load MediaPipe AI in background
    import("https://jsdelivr.net")
      .then(async function (visionPkg) {
        const vision = await visionPkg.FilesetResolver.forVisionTasks(
          "https://jsdelivr.net/wasm"
        );
        handLandmarker = await visionPkg.HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://googleapis.com",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 1,
          minHandDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        if (isRunning) {
          statusText.innerText = "Open your hand for green aura!";
        }
      })
      .catch(function (err) {
        statusText.innerText = "AI load issue: " + err.message;
      });
  </script>
</body>
</html>
